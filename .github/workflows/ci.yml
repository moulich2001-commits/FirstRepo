name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'

       - name: Compile Java
        run: javac src/ciccdemo/HelloWorld.java

      - name: Run Program
        run: java -cp src ciccdemo.HelloWorld

